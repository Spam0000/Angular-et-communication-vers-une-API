<h1>Pokedex</h1>

<input
	type="text"
	class="search"
	placeholder="Rechercher un Pokemon..."
	(input)="onSearch($event)"
/>

@if (pokemons().length === 0) {
	<p class="info">Chargement des Pokemon...</p>
} @else {
	<div class="grid">
		@for (pokemon of filtres(); track pokemon.id) {
			<a class="card" [routerLink]="['/pokemon', pokemon.name]">
				<img [src]="pokemon.image" [alt]="pokemon.name" loading="lazy" />
				<span class="num">#{{ pokemon.id }}</span>
				<span class="name">{{ pokemon.name }}</span>
			</a>
		} @empty {
			<p class="info">Aucun Pokemon ne correspond a "{{ recherche() }}"</p>
		}
	</div>
}
