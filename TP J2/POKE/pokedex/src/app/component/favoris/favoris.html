<h1>Mes favoris</h1>

@if (favoris.favoris().length === 0) {
	<p class="info">Aucun favori pour le moment.</p>
} @else {
	<ul class="liste">
		@for (name of favoris.favoris(); track name) {
			<li>
				<a [routerLink]="['/pokemon', name]">{{ name }}</a>
				<button (click)="favoris.basculer(name)">Retirer</button>
			</li>
		}
	</ul>
}
